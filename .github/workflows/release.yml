name: Release

# Publishes a GitHub Release when a version tag is pushed. The binaries are
# built from the tagged source and shipped with a SHA256SUMS file so that a
# downloaded agent can be verified before it runs in a pipeline.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false # no external dependencies, nothing to cache

      - name: Test
        run: go test -race ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/wisec-agent-${VERSION}-${os}-${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
          done
          cd dist && sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        # gh is preinstalled on the runner: no third-party action in the release path.
        # TAG goes through the environment rather than being interpolated into the
        # shell: ${{ }} is substituted before the shell sees the line, so a crafted
        # tag name would be executed instead of quoted. Same reason as VERSION above.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes
